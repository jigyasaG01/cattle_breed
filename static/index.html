<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Cattle Breed Analyzer</title>
    <link rel="stylesheet" href="/static/styles.css">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
</head>
<body>
    <div class="app">
        <header>
            <div class="logo">
                <svg width="32" height="32" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                    <path d="M12 2C6.48 2 2 6.48 2 12s4.48 10 10 10 10-4.48 10-10S17.52 2 12 2z"/>
                    <path d="M8 9c0-1 .5-2 2-2s2 1 2 2"/>
                    <path d="M12 9c0-1 .5-2 2-2s2 1 2 2"/>
                    <circle cx="8.5" cy="12" r="1"/>
                    <circle cx="15.5" cy="12" r="1"/>
                    <path d="M9 16c.8.8 2 1.2 3 1.2s2.2-.4 3-1.2"/>
                </svg>
                <h1>Cattle Breed Analyzer</h1>
            </div>
            <p class="subtitle">Upload a cattle image to identify the breed and assess body condition</p>
        </header>

        <main>
            <div class="upload-section">
                <div id="uploadBox" class="upload-box">
                    <input type="file" id="imageInput" accept="image/*" hidden>
                    <div class="upload-placeholder" id="uploadPlaceholder">
                        <svg width="48" height="48" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round">
                            <path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"/>
                            <polyline points="17 8 12 3 7 8"/>
                            <line x1="12" y1="3" x2="12" y2="15"/>
                        </svg>
                        <span class="upload-text">Click or drag to upload an image</span>
                        <span class="upload-hint">Supports JPG, PNG, WEBP</span>
                    </div>
                    <img id="previewImage" class="preview-image" alt="Preview">
                </div>

                <button id="analyzeBtn" class="analyze-btn" disabled>
                    <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                        <circle cx="11" cy="11" r="8"/>
                        <line x1="21" y1="21" x2="16.65" y2="16.65"/>
                    </svg>
                    <span>Analyze Image</span>
                </button>
            </div>

            <div id="resultBox" class="result-box hidden">
                <h2>Analysis Results</h2>
                <div class="results-grid">
                    <div class="result-card breed-card">
                        <div class="result-label">Breed Identified</div>
                        <div class="result-value" id="breedResult">—</div>
                        <div class="confidence-bar">
                            <div class="confidence-fill breed-fill" id="breedConfBar"></div>
                        </div>
                        <div class="confidence-text" id="breedConf">—</div>
                    </div>
                    <div class="result-card bcs-card">
                        <div class="result-label">Body Condition Score</div>
                        <div class="result-value" id="scoreResult">—</div>
                        <div class="confidence-bar">
                            <div class="confidence-fill bcs-fill" id="bcsConfBar"></div>
                        </div>
                        <div class="confidence-text" id="bcsConf">—</div>
                    </div>
                </div>
            </div>

            <div id="errorBox" class="error-box hidden">
                <span id="errorMsg"></span>
            </div>

            <div id="loadingOverlay" class="loading-overlay hidden">
                <div class="spinner"></div>
                <span>Analyzing...</span>
            </div>
        </main>

        <footer>
            <p>Cattle Breed Analyzer &mdash; Powered by ResNet-18 deep learning models</p>
        </footer>
    </div>

    <script src="/static/ui.js"></script>
</body>
</html>
